[build]
jobs = 12

[alias]
ci-local = "test --workspace --all-targets --all-features --offline"
test-all = "test --workspace --all-targets --all-features --offline"
clippy-all = "clippy --workspace --all-targets --all-features --offline -- -D warnings"

# Processes started by `cargo run`, `cargo test`, and `cargo bench` use the
# development Locket instance, including release-profile runs. Installed
# binaries never see this; they keep the real vault.
[env]
LOCKET_INSTANCE = "dev"
