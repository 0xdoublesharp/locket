[package]
name = "locket-core"
description = "Core policy and validation primitives for Locket"
edition.workspace = true
categories = ["command-line-utilities", "config", "development-tools"]
keywords = ["secrets", "env", "local-first", "security", "cli"]
license.workspace = true
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Match the workspace lints and register the verifier-specific cfg.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_crate_dependencies = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[dependencies]
# age 0.12 pulls crypto-bigint <0.7.6 (RUSTSEC-2026-0387) through HPKE.
age = "0.11.5"
bech32 = "0.12"
data-encoding = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
zeroize = { workspace = true }
url = "2"

[dev-dependencies]
proptest = { workspace = true }
