[package]
name = "locket-agent"
description = "Local agent and protocol types for Locket"
edition.workspace = true
categories = ["command-line-utilities"]
keywords = ["secrets", "agent", "ipc"]
license.workspace = true
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
locket-crypto = { version = "0.1.1", path = "../locket-crypto" }
locket-core = { version = "0.1.1", path = "../locket-core" }
locket-platform = { version = "0.1.1", path = "../locket-platform" }
locket-store = { version = "0.1.1", path = "../locket-store" }
data-encoding = { workspace = true }
directories = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["process", "fs"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["net"] }

[dev-dependencies]
x25519-dalek = { workspace = true, features = ["static_secrets"] }
tempfile = { workspace = true }
