[package]
name = "locket-agent"
description = "Local agent and protocol types for Locket"
edition.workspace = true
categories = ["command-line-utilities"]
keywords = ["secrets", "agent", "ipc"]
license.workspace = true
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Mirror the workspace lints and permit a local exception for the Windows pipe FFI.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_crate_dependencies = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[dependencies]
locket-crypto = { version = "0.3.9", path = "../locket-crypto" }
locket-core = { version = "0.3.9", path = "../locket-core" }
locket-platform = { version = "0.3.9", path = "../locket-platform" }
locket-scan = { version = "0.3.9", path = "../locket-scan" }
locket-store = { version = "0.3.9", path = "../locket-store" }
data-encoding = { workspace = true }
ed25519-dalek = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["process", "fs"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["net"] }

[dev-dependencies]
proptest = { workspace = true }
x25519-dalek = { workspace = true, features = ["static_secrets"] }
tempfile = { workspace = true }
