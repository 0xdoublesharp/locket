name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: Platform checks to run
        type: choice
        default: all
        options:
          - all
          - linux
          - windows

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "1"
  CARGO_JOBS: "2"
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare disposable test storage
        run: |
          mkdir -p "$RUNNER_TEMP/locket/tmp"
          echo "TMPDIR=$RUNNER_TEMP/locket/tmp" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-

      - name: Fetch locked dependencies for offline quality checks
        run: cargo fetch --locked

      - name: Check supply-chain exception ledger
        run: make supply-chain-exceptions

      - name: Generate third-party notices
        run: make third-party-notices

      - name: Validate distribution package definitions
        run: make distribution-check

      - name: Probe OS-host validation harnesses
        run: |
          scripts/validate-local-user-auth-real-host.sh --dry-run
          scripts/validate-packaged-os-canaries.sh --dry-run

      - name: Cargo check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy native desktop with warnings denied
        run: cargo clippy -p locket-desktop --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: |
          python3 -B scripts/mutation_smoke_test.py
          cargo test --workspace --all-targets --all-features --locked

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality-reports
          path: |
            target/quality/**
            supply-chain-exceptions.json
          if-no-files-found: ignore

  desktop-ui:
    name: desktop UI checks
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'

      - name: Check and test desktop UI
        run: make app-ui-check

      - name: Build desktop UI
        run: pnpm --dir crates/locket-app/ui build

  windows-transport:
    name: windows transport check
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Prepare disposable test storage
        shell: pwsh
        run: |
          $locketTmp = Join-Path $env:LOCALAPPDATA 'Locket/ci-tmp'
          New-Item -ItemType Directory -Path $locketTmp -Force | Out-Null
          $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl = [System.Security.AccessControl.DirectorySecurity]::new()
          $acl.SetOwner($user)
          $acl.SetAccessRuleProtection($true, $false)
          $inherit = [System.Security.AccessControl.InheritanceFlags]'ContainerInherit,ObjectInherit'
          $rule = [System.Security.AccessControl.FileSystemAccessRule]::new($user, 'FullControl', $inherit, 'None', 'Allow')
          $acl.AddAccessRule($rule)
          Set-Acl -LiteralPath $locketTmp -AclObject $acl
          foreach ($name in @('TMPDIR', 'TEMP', 'TMP')) {
            "$name=$locketTmp" >> $env:GITHUB_ENV
          }

      - name: Restore Windows cargo cache
        id: windows_cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-transport-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-windows-transport-${{ runner.os }}-

      - name: Lint Windows workspace
        id: windows_lint
        run: cargo clippy --workspace --all-targets --all-features --locked --keep-going -- -D warnings

      # These execute in a real Windows VM. Enrolled Windows Hello and physical
      # session lock/sleep ceremonies remain release-host acceptance checks.
      - name: Test Windows workspace
        if: ${{ !cancelled() && (steps.windows_lint.outcome == 'success' || steps.windows_lint.outcome == 'failure') }}
        run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast

      - name: Save Windows cargo cache
        if: ${{ !cancelled() && steps.windows_cargo_cache.outcome == 'success' && steps.windows_cargo_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.windows_cargo_cache.outputs.cache-primary-key }}
