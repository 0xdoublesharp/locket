name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_JOBS: "2"
  RUST_BACKTRACE: "1"

jobs:
  build:
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      LOCKET_RELEASE_RUNNER_ATTESTED: ${{ vars.LOCKET_RELEASE_RUNNER_ID }}
      PYTHONDONTWRITEBYTECODE: "1"
    name: auditable release build
    # Runner selection happens before environment variables are available.
    runs-on: ${{ fromJSON(vars.LOCKET_RELEASE_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    environment: release
    steps:
      - name: Prepare temporary path
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Require release tag
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: exit 1

      - name: Require isolated runner attestation
        shell: bash
        run: |
          if [[ -z "$LOCKET_RELEASE_RUNNER_ATTESTED" || "$LOCKET_RELEASE_RUNNER_ATTESTED" == local-dev ]]; then
            echo '::error::Set LOCKET_RELEASE_RUNNER_ID to the verified release runner identity.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'

      - name: Verify release versions
        env:
          LOCKET_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/distribution.mjs versions

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Cache cargo
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure Cargo Steward wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - name: Track Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: start
          target-dir: ${{ github.workspace }}/target
      - name: Install release audit tools
        run: cargo install --locked --jobs "$CARGO_JOBS" cargo-auditable rust-audit-info cargo-audit cargo-cyclonedx

      - name: Validate package manifests, signing inputs, and desktop security
        run: make distribution-check

      - name: Fetch locked dependencies for offline quality checks
        run: cargo fetch --locked

      - name: Verify reproducible CLI builds
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: make reproducible-check

      - name: Generate release quality artifacts
        id: quality
        run: |
          make supply-chain-exceptions
          make third-party-notices
          STRICT=1 make audit
          make unsafe-inventory
          STRICT=1 make sbom
          git diff --exit-code -- Cargo.lock

      - name: Build desktop UI
        run: |
          pnpm --dir crates/locket-app/ui install --frozen-lockfile
          pnpm --dir crates/locket-app/ui build

      - name: Build auditable binaries
        run: make release-auditable

      - name: Attest release binaries
        id: provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/locket
            target/release/locket-desktop

      - name: Verify release attestations
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        shell: bash
        run: |
          test -s "$PROVENANCE_BUNDLE"
          source_digest="$(git rev-parse HEAD)"
          for binary in target/release/locket target/release/locket-desktop; do
            gh attestation verify "$binary" --bundle "$PROVENANCE_BUNDLE" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "${GITHUB_WORKFLOW_REF%@*}" \
              --source-ref "$GITHUB_REF" --source-digest "$source_digest"
          done

      - name: Verify configured provenance policy
        env:
          SLSA_ARTIFACT: ${{ vars.LOCKET_SLSA_ARTIFACT }}
          SLSA_PROVENANCE: ${{ vars.LOCKET_SLSA_PROVENANCE }}
          SLSA_EXPECTED_REPOSITORY: ${{ vars.LOCKET_SLSA_EXPECTED_REPOSITORY }}
          SLSA_EXPECTED_BUILDER: ${{ vars.LOCKET_SLSA_EXPECTED_BUILDER }}
          SLSA_EXPECTED_BUILD_TYPE: ${{ vars.LOCKET_SLSA_EXPECTED_BUILD_TYPE }}
          SLSA_EXPECTED_WORKFLOW: ${{ vars.LOCKET_SLSA_EXPECTED_WORKFLOW }}
        run: |
          if [ -n "${SLSA_ARTIFACT}${SLSA_PROVENANCE}${SLSA_EXPECTED_REPOSITORY}${SLSA_EXPECTED_BUILDER}${SLSA_EXPECTED_BUILD_TYPE}${SLSA_EXPECTED_WORKFLOW}" ]; then
            make slsa-provenance STRICT=1
          else
            make slsa-provenance
          fi

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: locket-release-${{ github.ref_name }}
          path: |
            target/release/locket
            target/release/locket-desktop
            dist/installers/package-matrix.json
            dist/homebrew/locket.rb.in
          if-no-files-found: error

      - name: Upload release quality reports
        if: ${{ !cancelled() && (steps.quality.outcome == 'success' || steps.quality.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: locket-release-quality-${{ github.ref_name }}
          path: |
            target/quality/**
            supply-chain-exceptions.json
          if-no-files-found: ${{ steps.quality.outcome == 'success' && 'error' || 'warn' }}
      - name: Trim Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: trim
          target-dir: ${{ github.workspace }}/target
          budget: 4GiB
          keep-workspace: true
      - name: Save trimmed Cargo cache
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  validate-packages:
    needs: build
    uses: ./.github/workflows/package-validation.yml
    permissions:
      contents: read
