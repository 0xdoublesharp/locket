name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Optional existing release tag (e.g. v0.2.0) to attach built executables to"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_JOBS: "2"
  RUST_BACKTRACE: "1"

jobs:
  build:
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      LOCKET_RELEASE_RUNNER_ATTESTED: ${{ vars.LOCKET_RELEASE_RUNNER_ID }}
      PYTHONDONTWRITEBYTECODE: "1"
    name: auditable release build
    # Runner selection happens before environment variables are available.
    runs-on: ${{ fromJSON(vars.LOCKET_RELEASE_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    environment: release
    steps:
      - name: Prepare temporary path
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Require release tag
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: exit 1

      - name: Require isolated runner attestation
        shell: bash
        run: |
          if [[ -z "$LOCKET_RELEASE_RUNNER_ATTESTED" || "$LOCKET_RELEASE_RUNNER_ATTESTED" == local-dev ]]; then
            echo '::error::Set LOCKET_RELEASE_RUNNER_ID to the verified release runner identity.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'

      - name: Verify release versions
        env:
          LOCKET_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/distribution.mjs versions

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Cache cargo
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure Cargo Steward wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - name: Track Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: start
          target-dir: ${{ github.workspace }}/target
      - name: Install release audit tools
        run: cargo install --locked --jobs "$CARGO_JOBS" cargo-auditable rust-audit-info cargo-audit cargo-cyclonedx

      - name: Validate package manifests, signing inputs, and desktop security
        run: make distribution-check

      - name: Fetch locked dependencies for offline quality checks
        run: cargo fetch --locked

      - name: Verify reproducible CLI builds
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: make reproducible-check

      - name: Generate release quality artifacts
        id: quality
        run: |
          make supply-chain-exceptions
          make third-party-notices
          STRICT=1 make audit
          make unsafe-inventory
          STRICT=1 make sbom
          git diff --exit-code -- Cargo.lock

      - name: Build desktop UI
        run: |
          pnpm --dir crates/locket-app/ui install --frozen-lockfile
          pnpm --dir crates/locket-app/ui build

      - name: Build auditable binaries
        run: make release-auditable

      - name: Attest release binaries
        id: provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/locket
            target/release/locket-desktop

      - name: Verify release attestations
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        shell: bash
        run: |
          test -s "$PROVENANCE_BUNDLE"
          source_digest="$(git rev-parse HEAD)"
          for binary in target/release/locket target/release/locket-desktop; do
            gh attestation verify "$binary" --bundle "$PROVENANCE_BUNDLE" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "${GITHUB_WORKFLOW_REF%@*}" \
              --source-ref "$GITHUB_REF" --source-digest "$source_digest"
          done

      - name: Verify configured provenance policy
        env:
          SLSA_ARTIFACT: ${{ vars.LOCKET_SLSA_ARTIFACT }}
          SLSA_PROVENANCE: ${{ vars.LOCKET_SLSA_PROVENANCE }}
          SLSA_EXPECTED_REPOSITORY: ${{ vars.LOCKET_SLSA_EXPECTED_REPOSITORY }}
          SLSA_EXPECTED_BUILDER: ${{ vars.LOCKET_SLSA_EXPECTED_BUILDER }}
          SLSA_EXPECTED_BUILD_TYPE: ${{ vars.LOCKET_SLSA_EXPECTED_BUILD_TYPE }}
          SLSA_EXPECTED_WORKFLOW: ${{ vars.LOCKET_SLSA_EXPECTED_WORKFLOW }}
        run: |
          if [ -n "${SLSA_ARTIFACT}${SLSA_PROVENANCE}${SLSA_EXPECTED_REPOSITORY}${SLSA_EXPECTED_BUILDER}${SLSA_EXPECTED_BUILD_TYPE}${SLSA_EXPECTED_WORKFLOW}" ]; then
            make slsa-provenance STRICT=1
          else
            make slsa-provenance
          fi

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: locket-release-${{ github.ref_name }}
          path: |
            target/release/locket
            target/release/locket-desktop
            dist/installers/package-matrix.json
            dist/homebrew/locket.rb.in
          if-no-files-found: error

      - name: Upload release quality reports
        if: ${{ !cancelled() && (steps.quality.outcome == 'success' || steps.quality.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: locket-release-quality-${{ github.ref_name }}
          path: |
            target/quality/**
            supply-chain-exceptions.json
          if-no-files-found: ${{ steps.quality.outcome == 'success' && 'error' || 'warn' }}
      - name: Trim Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: trim
          target-dir: ${{ github.workspace }}/target
          budget: 4GiB
          keep-workspace: true
      - name: Save trimmed Cargo cache
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  validate-packages:
    needs: build
    uses: ./.github/workflows/package-validation.yml
    permissions:
      contents: read

  build-macos-intel:
    name: unsigned macOS Intel (x86_64) package
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_tag != ''
    runs-on: macos-26
    env:
      CARGO_BUILD_TARGET: x86_64-apple-darwin
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare disposable paths
        run: |
          mkdir -p "$RUNNER_TEMP/locket/tmp" "$RUNNER_TEMP/locket/cargo" "$RUNNER_TEMP/locket/build"
          {
            echo "TMPDIR=$RUNNER_TEMP/locket/tmp"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/locket/cargo"
            echo "LOCKET_BUILD_ROOT=$RUNNER_TEMP/locket/build"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'

      - name: Restore macOS Intel build cache
        id: intel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/locket/cargo
            ${{ runner.temp }}/locket/build/tools
          key: unsigned-macos-x86_64-tauri-2.10.1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install Rust x86_64 target and build tools
        run: |
          rustup show
          rustup target add x86_64-apple-darwin
          if [[ ! -x "$LOCKET_BUILD_ROOT/tools/bin/cargo-tauri" ]] || [[ "$("$LOCKET_BUILD_ROOT/tools/bin/cargo-tauri" --version)" != 'tauri-cli 2.10.1' ]]; then
            cargo install tauri-cli --version 2.10.1 --locked --force --root "$LOCKET_BUILD_ROOT/tools"
          fi
          echo "$LOCKET_BUILD_ROOT/tools/bin" >> "$GITHUB_PATH"
          pnpm --dir crates/locket-app/ui install --frozen-lockfile

      - name: Build macOS Intel installer and standalone CLI archive
        run: |
          scripts/package-native-installers.sh --target macos-pkg --unsigned
          version="$(node scripts/distribution.mjs versions)"
          cli_out="$LOCKET_BUILD_ROOT/package/cli"
          mkdir -p "$cli_out"
          tar -C "$LOCKET_BUILD_ROOT/package/installers/stage" -czf "$cli_out/locket-${version}-x86_64-apple-darwin.tar.gz" locket

      - name: Save macOS Intel build cache
        if: success() && steps.intel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/locket/cargo
            ${{ runner.temp }}/locket/build/tools
          key: unsigned-macos-x86_64-tauri-2.10.1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - uses: actions/upload-artifact@v4
        with:
          name: locket-unsigned-macos-x86_64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/locket/build/package/installers/macos/*unsigned.pkg
            ${{ runner.temp }}/locket/build/package/cli/*
          if-no-files-found: error

  publish-release:
    name: publish GitHub Release assets
    needs: [build, validate-packages, build-macos-intel]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_tag != ''
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: locket-unsigned-macos-26-${{ github.sha }}
          path: staging/macos-arm64

      - uses: actions/download-artifact@v4
        with:
          name: locket-unsigned-macos-x86_64-${{ github.sha }}
          path: staging/macos-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: locket-unsigned-ubuntu-24.04-${{ github.sha }}
          path: staging/linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: locket-unsigned-windows-2025-${{ github.sha }}
          path: staging/windows-x86_64

      - name: Assemble release assets and SHA256SUMS
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.publish_tag }}"
          if [[ "$release_tag" != v* ]]; then
            echo "::error::Release tag must start with v, got: $release_tag"
            exit 1
          fi
          mkdir -p release-assets
          cp staging/macos-arm64/installers/macos/*-arm64-unsigned.pkg release-assets/
          cp staging/macos-arm64/cli/locket-*-aarch64-apple-darwin.tar.gz release-assets/
          cp staging/macos-x86_64/installers/macos/*-x86_64-unsigned.pkg release-assets/
          cp staging/macos-x86_64/cli/locket-*-x86_64-apple-darwin.tar.gz release-assets/
          cp staging/linux-x86_64/installers/linux/*.deb release-assets/
          cp staging/linux-x86_64/cli/locket-*-x86_64-unknown-linux-gnu.tar.gz release-assets/
          cp staging/linux-x86_64/vscode/*.vsix release-assets/
          cp staging/windows-x86_64/installers/windows/*.msi release-assets/
          cp staging/windows-x86_64/cli/locket-*-x86_64-pc-windows-msvc.zip release-assets/
          (
            cd release-assets
            LC_ALL=C sha256sum -- * > SHA256SUMS.txt
          )
          ls -la release-assets
          cat release-assets/SHA256SUMS.txt
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Attest downloadable release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.assemble.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          sed 's/^          //' > release-notes.md <<EOF
          ## Locket ${RELEASE_TAG}

          ### Downloads
          - **macOS (Apple Silicon / arm64)**: \`Locket-*-arm64-unsigned.pkg\` (Desktop app + bundled CLI) or \`locket-*-aarch64-apple-darwin.tar.gz\` (standalone CLI)
          - **macOS (Intel / x86_64)**: \`Locket-*-x86_64-unsigned.pkg\` (Desktop app + bundled CLI) or \`locket-*-x86_64-apple-darwin.tar.gz\` (standalone CLI)
          - **Linux (x86_64)**: \`locket_*_x86_64.deb\` (Desktop app + bundled CLI) or \`locket-*-x86_64-unknown-linux-gnu.tar.gz\` (standalone CLI)
          - **Windows (x86_64)**: \`Locket-*-AMD64.msi\` (Desktop app + bundled CLI) or \`locket-*-x86_64-pc-windows-msvc.zip\` (standalone CLI)
          - **VS Code Extension**: \`locket-*.vsix\`
          - **Checksums**: \`SHA256SUMS.txt\`

          ### Verification
          Every release asset is built on public GitHub Actions runners and attested with GitHub Build Provenance:

          \`\`\`sh
          sha256sum -c SHA256SUMS.txt --ignore-missing
          gh attestation verify <downloaded-file> --repo ${GITHUB_REPOSITORY}
          \`\`\`

          > **Note on unsigned macOS builds**: These free community builds are ad-hoc signed rather than Apple Developer ID notarized. On macOS, right-click the \`.pkg\` and choose **Open** (or clear quarantine with \`xattr -d com.apple.quarantine <file>\`) after verifying the SHA-256 checksum and GitHub provenance attestation.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Locket ${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
