name: fuzz-nightly

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "1"
  CARGO_JOBS: "2"
  FUZZ_TIME: "900"
  FUZZ_MAX_LEN: "65536"
  FUZZ_TIMEOUT: "30"
  FUZZ_RSS_LIMIT_MB: "2048"
  RUST_BACKTRACE: "1"

jobs:
  fuzz:
    name: nightly fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Cache cargo and fuzz state
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: fuzz-nightly-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'fuzz/Cargo.toml') }}
          restore-keys: |
            fuzz-nightly-${{ runner.os }}-

      - name: Configure Cargo Steward wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - name: Track Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: start
          target-dir: ${{ github.workspace }}/target
      - name: Track Cargo build cache (fuzz)
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: start
          working-directory: fuzz
          target-dir: ${{ github.workspace }}/fuzz/target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run nightly fuzz budget
        run: make fuzz-nightly

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-nightly-artifacts
          path: |
            fuzz/artifacts/**
            fuzz/corpus/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Trim Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: trim
          target-dir: ${{ github.workspace }}/target
          budget: 4GiB
          keep-workspace: true
          keep-incremental: true
      - name: Trim Cargo build cache (fuzz)
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: trim
          working-directory: fuzz
          target-dir: ${{ github.workspace }}/fuzz/target
          budget: 4GiB
          keep-workspace: true
          keep-incremental: true
      - name: Save trimmed Cargo cache
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
