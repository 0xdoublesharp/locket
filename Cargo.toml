[workspace]
members = [
    "crates/locket-agent",
    "crates/locket-app",
    "crates/locket-app/src-tauri",
    "crates/locket-cli",
    "crates/locket-core",
    "crates/locket-crypto",
    "crates/locket-docker",
    "crates/locket-exec",
    "crates/locket-platform",
    "crates/locket-scan",
    "crates/locket-store",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/doublesharp/locket"
rust-version = "1.99"
version = "0.1.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
arboard = "3"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
clap_complete = "4.5.3"
data-encoding = "2"
directories = "6"
dotenvy = "0.15"
ed25519-dalek = "3"
flate2 = "1"
hkdf = "0.13"
hmac = "0.13"
ignore = "0.4"
interprocess = "2"
keyring-core = "1"
libc = "0.2"
passkey = "0.4"
proptest = "1"
rand = "0.10"
regex = "1"
rpassword = "7"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
rustix = { version = "1", features = ["process"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.11"
shlex = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
x25519-dalek = "3"
zeroize = "1"
